<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotBlind CRM v2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-gray-100 font-sans min-h-screen p-4 md:p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Шапка -->
        <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡</span>
                <div>
                    <h1 class="text-xl font-extrabold flex items-center gap-2">
                        NotBlind 
                        <span class="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded-full uppercase tracking-wider">CRM v2.0</span>
                    </h1>
                </div>
            </div>
            <button onclick="loadData()" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl border border-slate-700 transition">
                🔄
            </button>
        </div>

        <!-- 4 Карточки статистики -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                <div class="text-xs text-slate-400 font-medium">Пользователи</div>
                <div id="stat-total" class="text-2xl font-black text-blue-400 mt-1">...</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                <div class="text-xs text-slate-400 font-medium">Активные подписки</div>
                <div id="stat-active" class="text-2xl font-black text-green-400 mt-1">...</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                <div class="text-xs text-slate-400 font-medium">Платные юзеры</div>
                <div id="stat-paid" class="text-2xl font-black text-amber-400 mt-1">...</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                <div class="text-xs text-slate-400 font-medium">Заблокировано</div>
                <div id="stat-banned" class="text-2xl font-black text-red-400 mt-1">...</div>
            </div>
        </div>

        <!-- Таблица базы пользователей с поиском -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                <h2 class="text-sm font-bold text-blue-400 uppercase tracking-wider flex items-center gap-2">
                    👥 База пользователей
                </h2>
                <input id="search-input" type="text" placeholder="Поиск по ID или Username..." class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs w-full md:w-64 focus:outline-none focus:border-blue-500">
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 uppercase">
                            <th class="p-3">User ID</th>
                            <th class="p-3">Юзер</th>
                            <th class="p-3">Подписка до</th>
                            <th class="p-3">Статус</th>
                            <th class="p-3 text-right">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-slate-800/50">
                        <tr><td colspan="5" class="p-4 text-center text-slate-500">Загрузка базы...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Нижняя сетка: Управление промокодами и Конструктор рассылок -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Промокоды -->
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                    🎟 Управление промокодами
                </h2>
                <div class="space-y-3">
                    <input id="p-code" type="text" placeholder="КОД (напр: VIP2026)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:outline-none focus:border-amber-500 uppercase">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="p-days" type="number" placeholder="Дни подписки" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:outline-none focus:border-amber-500">
                        <input id="p-uses" type="number" placeholder="Лимит активаций" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:outline-none focus:border-amber-500">
                    </div>
                    <button onclick="createPromo()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-amber-500/10">
                        ➕ Создать промокод
                    </button>
                </div>
            </div>

            <!-- Конструктор рассылок -->
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                <h2 class="text-sm font-bold text-blue-400 uppercase tracking-wider flex items-center gap-2">
                    📢 Конструктор рассылок
                </h2>
                <div class="space-y-3">
                    <select id="broadcast-target" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:outline-none focus:border-blue-500">
                        <option value="all">👥 Всем пользователям</option>
                        <option value="active">✅ Только с активной подпиской</option>
                        <option value="expired">❌ Только с истекшей подпиской</option>
                    </select>
                    <textarea id="broadcast-text" rows="3" placeholder="Текст рассылки (поддерживает HTML)..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:outline-none focus:border-blue-500 resize-none"></textarea>
                    <button onclick="startBroadcast()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-blue-600/10">
                        🚀 Запустить рассылку
                    </button>
                </div>
            </div>
        </div>

        <!-- Логи событий -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3">
            <h2 class="text-sm font-bold text-purple-400 uppercase tracking-wider flex items-center gap-2">
                📋 Логи событий системы
            </h2>
            <div id="logs-container" class="text-[11px] font-mono bg-slate-950 border border-slate-800 p-3 rounded-xl max-h-40 overflow-y-auto space-y-1 text-slate-300">
                Загрузка логов...
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const API_URL = "http://localhost:8080"; // Или ваш ngrok URL (например: https://xxxx.ngrok-free.app)

        async function loadData() {
            try {
                let res = await fetch(`${API_URL}/api/stats`);
                let data = await res.json();
                
                document.getElementById('stat-total').innerText = data.stats.total;
                document.getElementById('stat-active').innerText = data.stats.active;
                document.getElementById('stat-paid').innerText = data.stats.paid;
                document.getElementById('stat-banned').innerText = data.stats.banned;

                let logsHtml = "";
                data.logs.forEach(l => {
                    logsHtml += `<div class="border-b border-slate-900 pb-1">[${l.timestamp}] <span class="text-amber-400">${l.action}</span>: ${l.details}</div>`;
                });
                document.getElementById('logs-container').innerHTML = logsHtml || "Нет логов";
            } catch(e) {
                console.log("Ошибка загрузки данных", e);
            }
        }
        loadData();

        async function createPromo() {
            let code = document.getElementById('p-code').value.trim();
            let days = document.getElementById('p-days').value;
            let uses = document.getElementById('p-uses').value;
            if(!code || !days || !uses) {
                alert("Заполните все поля промокода!");
                return;
            }
            let res = await fetch(`${API_URL}/api/promo/create`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({code, days, uses})
            });
            if((await res.json()).success) {
                alert("Промокод успешно создан!");
                document.getElementById('p-code').value = "";
                document.getElementById('p-days').value = "";
                document.getElementById('p-uses').value = "";
                loadData();
            }
        }

        async function startBroadcast() {
            let target = document.getElementById('broadcast-target').value;
            let text = document.getElementById('broadcast-text').value.trim();
            if(!text) {
                alert("Введите текст рассылки!");
                return;
            }
            // Передаем команду боту через Telegram WebApp
            tg.sendData(JSON.stringify({action: "broadcast", target, text}));
            tg.close();
        }
    </script>
</body>
</html>
