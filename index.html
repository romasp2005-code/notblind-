<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель NotBlind</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-md mx-auto w-full">
        <!-- Шапка -->
        <div class="text-center mb-6 mt-4">
            <h1 class="text-2xl font-extrabold tracking-tight">🛠 Админ-панель</h1>
            <p class="text-sm text-gray-400 mt-1">Мониторинг активности NotBlind Bot</p>
        </div>

        <!-- Карточки статистики -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow-sm">
                <div class="text-xs text-gray-400 font-medium uppercase">Всего юзеров</div>
                <div id="total-users" class="text-2xl font-bold mt-1 text-blue-400">1</div>
            </div>
            <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow-sm">
                <div class="text-xs text-gray-400 font-medium uppercase">Платные подписки</div>
                <div id="paid-users" class="text-2xl font-bold mt-1 text-emerald-400">0</div>
            </div>
        </div>

        <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow-sm mb-4">
            <div class="text-xs text-gray-400 font-medium uppercase">На пробном периоде (Trial)</div>
            <div id="trial-users" class="text-2xl font-bold mt-1 text-amber-400">1</div>
        </div>

        <!-- Новые пользователи -->
        <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow-sm">
            <div class="text-sm font-semibold mb-3 text-gray-300">📈 Новые регистрации</div>
            <div class="space-y-2 text-sm">
                <div class="flex justify-between py-1 border-b border-gray-700">
                    <span class="text-gray-400">За сутки:</span>
                    <span id="new-today" class="font-bold">1</span>
                </div>
                <div class="flex justify-between py-1 border-b border-gray-700">
                    <span class="text-gray-400">За месяц:</span>
                    <span id="new-month" class="font-bold">1</span>
                </div>
                <div class="flex justify-between py-1">
                    <span class="text-gray-400">За год:</span>
                    <span id="new-year" class="font-bold">1</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Кнопка обновления -->
    <div class="max-w-md mx-auto w-full mt-6">
        <button onclick="refreshData()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-lg">
            🔄 Обновить данные
        </button>
        <p class="text-center text-xs text-gray-500 mt-3">NotBlind Admin System © 2026</p>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран

        // Автоподстройка под светлую тему Telegram, если включена
        if (tg.colorScheme === 'light') {
            document.body.classList.remove('bg-gray-900', 'text-gray-100');
            document.body.classList.add('bg-gray-50', 'text-gray-900');
        }

        function refreshData() {
            // Тактильная отдача при нажатии (вибрация на телефоне)
            if(tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
            alert("Данные успешно актуализированы!");
        }
    </script>
</body>
</html>
