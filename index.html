<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Админ-панель NotBlind</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4">

    <div class="max-w-md mx-auto space-y-4 pb-10">
        <div class="text-center mt-2">
            <h1 class="text-2xl font-extrabold text-amber-400">🛡 NotBlind CRM</h1>
            <p class="text-xs text-gray-400">Центр управления ботом</p>
        </div>

        <!-- Статистика -->
        <div class="grid grid-cols-2 gap-2">
            <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 text-center">
                <div class="text-xs text-gray-400">Всего юзеров</div>
                <div id="st-total" class="text-lg font-bold text-blue-400">-</div>
            </div>
            <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 text-center">
                <div class="text-xs text-gray-400">Активных подписок</div>
                <div id="st-active" class="text-lg font-bold text-green-400">-</div>
            </div>
        </div>

        <!-- Поиск пользователя -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-2">
            <h2 class="text-sm font-bold text-amber-400">🔍 Управление пользователем</h2>
            <div class="flex gap-2">
                <input id="search-uid" type="number" placeholder="Введите User ID" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
                <button onclick="searchUser()" class="bg-blue-600 hover:bg-blue-500 px-4 rounded-lg text-sm font-bold">Найти</button>
            </div>
            <div id="user-result" class="hidden text-xs bg-gray-900 p-3 rounded-lg border border-gray-700 space-y-2 mt-2">
                <div>ID: <span id="res-id" class="font-mono"></span></div>
                <div>Статус подписки: <span id="res-sub" class="font-bold"></span></div>
                <div>Забанен: <span id="res-ban" class="font-bold"></span></div>
                <div class="flex gap-2 pt-2">
                    <button onclick="modifySub(30)" class="bg-green-600 hover:bg-green-500 px-2 py-1 rounded text-white">+30 дней</button>
                    <button onclick="toggleBan()" id="btn-ban" class="bg-red-600 hover:bg-red-500 px-2 py-1 rounded text-white">Бан</button>
                </div>
            </div>
        </div>

        <!-- Создание промокода -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-2">
            <h2 class="text-sm font-bold text-amber-400">🎟 Создать промокод</h2>
            <input id="p-code" type="text" placeholder="Код (напр: VIP)" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
            <div class="grid grid-cols-2 gap-2">
                <input id="p-days" type="number" placeholder="Дней" class="bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
                <input id="p-uses" type="number" placeholder="Лимит" class="bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
            </div>
            <button onclick="createPromo()" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-2 rounded-lg text-sm">Создать</button>
        </div>

        <!-- Логи активности -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-2">
            <h2 class="text-sm font-bold text-blue-400">📋 Последние логи</h2>
            <div id="logs-container" class="text-[10px] font-mono bg-gray-900 p-2 rounded-lg max-h-40 overflow-y-auto space-y-1 text-gray-300">
                Загрузка логов...
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let currentSearchedUid = null;

        // Загрузка статистики
        async function loadStats() {
            try {
                let res = await fetch('http://ВАШ_IP_ИЛИ_ДОМЕН:8080/api/stats');
                let data = await res.json();
                document.getElementById('st-total').innerText = data.stats.total;
                document.getElementById('st-active').innerText = data.stats.active;
                
                let logsHtml = "";
                data.logs.forEach(l => {
                    logsHtml += `<div>[${l.timestamp}] <b>${l.action}</b>: ${l.details}</div>`;
                });
                document.getElementById('logs-container').innerHTML = logsHtml;
            } catch(e) {
                console.log("Ошибка загрузки API статы", e);
            }
        }
        loadStats();

        async function searchUser() {
            let uid = document.getElementById('search-uid').value;
            if(!uid) return;
            let res = await fetch('http://ВАШ_IP_ИЛИ_ДОМЕН:8080/api/user/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: uid})
            });
            let data = await res.json();
            if(data.success) {
                currentSearchedUid = uid;
                document.getElementById('user-result').classList.remove('hidden');
                document.getElementById('res-id').innerText = data.user.user_id;
                document.getElementById('res-sub').innerText = data.user.sub_expire || "Не активна";
                document.getElementById('res-ban').innerText = data.user.is_banned ? "Да" : "Нет";
                document.getElementById('btn-ban').innerText = data.user.is_banned ? "Разбанить" : "Забанить";
            } else {
                alert(data.error);
            }
        }

        async function modifySub(days) {
            if(!currentSearchedUid) return;
            await fetch('http://ВАШ_IP_ИЛИ_ДОМЕН:8080/api/user/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: currentSearchedUid, action: 'add_days', days: days})
            });
            alert("Подписка успешно продлена!");
            searchUser();
        }

        async function toggleBan() {
            if(!currentSearchedUid) return;
            let isBan = document.getElementById('btn-ban').innerText === "Забанить";
            await fetch('http://ВАШ_IP_ИЛИ_ДОМЕН:8080/api/user/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: currentSearchedUid, action: isBan ? 'ban' : 'unban'})
            });
            searchUser();
        }

        async function createPromo() {
            let code = document.getElementById('p-code').value;
            let days = document.getElementById('p-days').value;
            let uses = document.getElementById('p-uses').value;
            await fetch('http://ВАШ_IP_ИЛИ_ДОМЕН:8080/api/promo/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({code, days, uses})
            });
            alert("Промокод успешно создан в БД!");
        }
    </script>
</body>
</html>
