<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель NotBlind</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-md mx-auto w-full">
        <div class="text-center mb-6 mt-2">
            <h1 class="text-2xl font-extrabold">🛠 Админ-панель NotBlind</h1>
            <p class="text-xs text-gray-400 mt-1">Управление подписками и промокодами</p>
        </div>

        <!-- Генератор промокодов -->
        <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 mb-4">
            <h2 class="text-sm font-bold text-amber-400 mb-3 uppercase tracking-wider">🎟 Создать промокод</h2>
            <div class="space-y-3">
                <input id="promo-code" type="text" placeholder="Например: START2026" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-amber-400">
                <div class="grid grid-cols-2 gap-2">
                    <input id="promo-days" type="number" placeholder="Дней (напр: 7)" class="bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-amber-400">
                    <input id="promo-uses" type="number" placeholder="Лимит активаций" class="bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-amber-400">
                </div>
                <button onclick="savePromo()" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-2.5 rounded-xl transition">
                    💾 Сохранить промокод в БД
                </button>
            </div>
        </div>

        <!-- Рассылка -->
        <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 mb-4">
            <h2 class="text-sm font-bold text-blue-400 mb-3 uppercase tracking-wider">📢 Массовая рассылка</h2>
            <p class="text-xs text-gray-400 mb-2">Нажмите для запуска рассылки через бота:</p>
            <button onclick="startBroadcast()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl transition">
                🚀 Начать рассылку
            </button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function savePromo() {
            let code = document.getElementById('promo-code').value.trim();
            let days = document.getElementById('promo-days').value;
            let uses = document.getElementById('promo-uses').value;

            if(!code || !days || !uses) {
                alert("Заполните все поля!");
                return;
            }

            // Прямое добавление в локальную базу данных через Python-скрипт или отправку команды
            // Для упрощения отправляем команду боту через WebApp data
            let payload = JSON.stringify({action: "add_promo", code: code, days: days, uses: uses});
            tg.sendData(payload);
            tg.close();
        }

        function startBroadcast() {
            tg.sendData("/broadcast");
            tg.close();
        }
    </script>
</body>
</html>
